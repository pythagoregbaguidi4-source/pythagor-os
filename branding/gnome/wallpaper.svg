<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Fond d'écran PYTHAGOR OS — wordmark cyan sur fond sombre profond.
       Converti en PNG à la compilation (ImageMagick, hors chroot). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%"  stop-color="#0e161c"/>
      <stop offset="55%" stop-color="#0a0e12"/>
      <stop offset="100%" stop-color="#05080a"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00e5e5"/>
      <stop offset="100%" stop-color="#33b1c9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- fine grille discrète -->
  <g stroke="#0f1b22" stroke-width="1" opacity="0.5">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
  </g>

  <!-- wordmark -->
  <g font-family="'DejaVu Sans Mono','Menlo',monospace" text-anchor="middle" filter="url(#glow)">
    <text x="960" y="530" font-size="150" font-weight="700"
          letter-spacing="14" fill="url(#ink)">PYTHAGOR</text>
    <text x="960" y="628" font-size="62" font-weight="400"
          letter-spacing="46" fill="#e8fbfb">O&#160;S</text>
  </g>

  <text x="960" y="712" text-anchor="middle"
        font-family="'DejaVu Sans','Helvetica',sans-serif"
        font-size="26" letter-spacing="8" fill="#3d5560">0.1</text>
</svg>
