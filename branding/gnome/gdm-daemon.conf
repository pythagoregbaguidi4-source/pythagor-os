# /etc/gdm3/daemon.conf — PYTHAGOR OS (session live).
# Un SEUL groupe [daemon] (le critique de build l'exige : deux blocs = GDM ne
# parse plus = pas d'interface graphique).
[daemon]
# X11 plutôt que Wayland : bien plus robuste au boot sur matériel inconnu
# (clé USB live) et le flou GNOME Shell fonctionne aussi sous Xorg.
WaylandEnable=false
# Autologin de l'utilisateur live (cohérent avec live-config.username=pythagor).
AutomaticLoginEnable=true
AutomaticLogin=pythagor
