name: build PYTHAGOR OS

# Contourne la contrainte disque de la machine locale : les runners GitHub
# offrent ~14 Go libres sur / et bien plus sur /mnt, gratuitement.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  desktop:
    name: ISO amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Construire l'ISO
        run: |
          chmod +x desktop/build.sh
          ./desktop/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pythagor-os-amd64-iso
          path: out/*.iso

  mobile:
    name: rootfs arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Construire le rootfs
        run: |
          chmod +x mobile/build-rootfs.sh
          ./mobile/build-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pythagor-os-arm64-rootfs
          path: |
            out/*.tar.gz
            out/*.sha256
