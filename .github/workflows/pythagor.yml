name: build PYTHAGOR OS

# Contourne la contrainte disque de la machine locale : les runners GitHub
# offrent ~14 Go libres sur / (et bien plus après nettoyage), gratuitement.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cible:
        description: "Quelle édition construire"
        type: choice
        default: mobile
        options: [mobile, desktop, les-deux]

jobs:
  mobile:
    name: rootfs arm64 (Android)
    # Un tag construit tout ; un lancement manuel ne construit que le demandé.
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["mobile","les-deux"]'), inputs.cible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Émulation arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Construire le rootfs
        run: |
          chmod +x mobile/build-rootfs.sh common/apply-branding.sh
          ./mobile/build-rootfs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pythagor-os-arm64-rootfs
          path: |
            out/*.tar.gz
            out/*.sha256
          retention-days: 30

  desktop:
    name: ISO amd64 (PC)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["desktop","les-deux"]'), inputs.cible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          # Un ISO GNOME + outils est volumineux ; / n'a que ~14 Go.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /usr/share/swift || true
          sudo apt-get clean
          # Déplacer le stockage Docker sur /mnt (~70 Go) : le build vit dans le
          # conteneur, donc tout le scratch profite du grand disque.
          sudo systemctl stop docker || true
          sudo mkdir -p /mnt/docker
          sudo mv /var/lib/docker /mnt/docker-old 2>/dev/null || true
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker || sudo service docker start || true
          echo "=== espace ==="; df -h / /mnt

      - name: Construire l'ISO
        run: |
          chmod +x desktop/build.sh common/apply-branding.sh
          ./desktop/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pythagor-os-amd64-iso
          path: out/*.iso
          retention-days: 30
