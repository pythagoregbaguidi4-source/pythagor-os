name: publier l'ISO en Release

# Récupère l'ISO déjà construit et le publie en Release (téléchargement direct,
# sans login). L'ISO brut dépasse la limite de 2 Gio des assets GitHub → on
# publie sa version .zip (sous la limite, décompressable partout).
# Tag 'iso-*' choisi exprès pour NE PAS déclencher le workflow de build (tags 'v*').
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID du run contenant l'artefact ISO"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Récupérer l'ISO du run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.run_id }} -n pythagor-os-amd64-iso \
            -R ${{ github.repository }} -D iso
          ls -lh iso/

      - name: Compresser (< 2 Gio pour l'asset Release)
        run: |
          cd iso
          zip -9 pythagor-os-0.1-amd64.iso.zip pythagor-os-0.1-amd64.iso
          sz=$(stat -c%s pythagor-os-0.1-amd64.iso.zip)
          echo "zip = $sz octets (limite 2147483648)"
          [ "$sz" -lt 2147483648 ] || { echo "TROP GROS même zippé"; exit 1; }
          sha256sum pythagor-os-0.1-amd64.iso.zip | tee pythagor-os-0.1-amd64.iso.zip.sha256

      - name: Publier la Release (création puis upload, avec réessais)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view iso-0.1 -R "$R" >/dev/null 2>&1 || \
            gh release create iso-0.1 -R "$R" \
              --title "PYTHAGOR OS 0.1 — édition PC" \
              --notes "ISO live bootable (BIOS + UEFI). Bureau GNOME identité PYTHAGOR : sombre, accent cyan, effet verre (Graphite + blur), icônes Papirus, dock. 114 outils cybersécu. Mises à jour en place via 'pythagor-update' (plus besoin de retélécharger l'ISO). Télécharge le .zip, décompresse, grave l'ISO sur clé USB (≥ 4 Go)."
          for i in 1 2 3 4 5; do
            if gh release upload iso-0.1 \
                 iso/pythagor-os-0.1-amd64.iso.zip \
                 iso/pythagor-os-0.1-amd64.iso.zip.sha256 \
                 -R "$R" --clobber; then echo "upload OK"; break; fi
            echo "réessai $i"; sleep 10
          done
          echo "=== LIEN DIRECT ==="
          echo "https://github.com/$R/releases/download/iso-0.1/pythagor-os-0.1-amd64.iso.zip"
