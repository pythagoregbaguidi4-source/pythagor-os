name: publier l'ISO en Release

# Récupère l'ISO déjà construit et le publie en Release (téléchargement direct,
# sans login). L'ISO dépasse la limite de 2 Gio par asset GitHub (même zippé :
# c'est du squashfs déjà compressé, ~1 %). On le DÉCOUPE donc en parts < 2 Gio
# que l'utilisateur reconstitue avec `cat` (aucune décompression).
# Tag 'iso-*' choisi exprès pour NE PAS déclencher le workflow de build (tags 'v*').
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID du run contenant l'artefact ISO"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Récupérer le dépôt (pour les notes de Release)
        uses: actions/checkout@v4

      - name: Récupérer l'ISO du run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.run_id }} -n pythagor-os-amd64-iso \
            -R ${{ github.repository }} -D iso
          ls -lh iso/

      - name: Découper l'ISO en parts < 2 Gio (limite asset GitHub)
        run: |
          cd iso
          ISO=pythagor-os-0.1-amd64.iso
          sha256sum "$ISO" | tee "$ISO.sha256"
          # parts de 1900 MiB (chacune < 2 GiB) ; reconstitution par `cat`.
          split -b 1900m -d --suffix-length=2 "$ISO" "$ISO.part"
          ls -lh "$ISO".part*
          for p in "$ISO".part*; do
            sz=$(stat -c%s "$p")
            echo "$p = $sz octets"
            [ "$sz" -lt 2147483648 ] || { echo "part $p TROP GROSSE"; exit 1; }
          done

      - name: Publier la Release (parts, remplace l'ancien .zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          ISO=pythagor-os-0.1-amd64.iso
          gh release view iso-0.1 -R "$R" >/dev/null 2>&1 || \
            gh release create iso-0.1 -R "$R" --title "PYTHAGOR OS 0.1 — édition PC" --notes "PYTHAGOR OS 0.1"
          # retirer les anciens assets .zip devenus obsolètes
          gh release delete-asset iso-0.1 pythagor-os-0.1-amd64.iso.zip        -R "$R" -y 2>/dev/null || true
          gh release delete-asset iso-0.1 pythagor-os-0.1-amd64.iso.zip.sha256 -R "$R" -y 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if gh release upload iso-0.1 iso/$ISO.part* iso/$ISO.sha256 -R "$R" --clobber; then echo "upload OK"; break; fi
            echo "réessai $i"; sleep 10
          done

      - name: Mettre à jour les notes (reconstitution + gravure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release edit iso-0.1 -R "$R" \
            --title "PYTHAGOR OS 0.1 — édition PC" \
            --notes-file .github/release-notes-iso.md
          echo "=== LIENS DIRECTS ==="
          for f in part00 part01; do
            echo "https://github.com/$R/releases/download/iso-0.1/pythagor-os-0.1-amd64.iso.$f"
          done
